name: Build & Release Desktop App

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish to GitHub Releases'
        required: false
        type: boolean
        default: false
      prerelease:
        description: 'Mark as Pre-release'
        required: false
        type: boolean
        default: false
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'packages/desktop/**'
      - 'packages/services/**'
      - 'packages/shared/**'
      - 'packages/ui/**'
      - 'pnpm-lock.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os_name }}-${{ matrix.target_arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os_name: windows
            runner: windows-latest
            target_os: win
            target_arch: x64
          - os_name: macos-arm64
            runner: macos-latest
            target_os: mac
            target_arch: arm64
          - os_name: macos-x64
            runner: macos-13
            target_os: mac
            target_arch: x64
          - os_name: linux
            runner: ubuntu-latest
            target_os: linux
            target_arch: x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Cache Electron binaries (Linux / macOS)
        if: runner.os != 'Windows'
        uses: actions/cache@v4
        with:
          path: ~/.cache/electron
          key: electron-cache-${{ runner.os }}-${{ matrix.target_arch }}-${{ hashFiles('packages/desktop/package.json') }}
          restore-keys: |
            electron-cache-${{ runner.os }}-${{ matrix.target_arch }}-
            electron-cache-${{ runner.os }}-

      - name: Cache Electron binaries (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\electron\Cache
          key: electron-cache-windows-${{ matrix.target_arch }}-${{ hashFiles('packages/desktop/package.json') }}
          restore-keys: |
            electron-cache-windows-${{ matrix.target_arch }}-
            electron-cache-windows-

      - name: Cache electron-builder tools (Linux / macOS)
        if: runner.os != 'Windows'
        uses: actions/cache@v4
        with:
          path: ~/.cache/electron-builder
          key: electron-builder-tools-${{ runner.os }}-${{ hashFiles('packages/desktop/package.json') }}
          restore-keys: |
            electron-builder-tools-${{ runner.os }}-

      - name: Cache electron-builder tools (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\electron-builder\Cache
          key: electron-builder-tools-windows-${{ hashFiles('packages/desktop/package.json') }}
          restore-keys: |
            electron-builder-tools-windows-

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm libarchive-tools

      - name: Install project dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm build:bootstrap
        env:
          ZCODE_SKIP_REMOTE_ASSETS: '1'

      - name: Bundle Desktop App (${{ matrix.target_os }}/${{ matrix.target_arch }})
        run: pnpm --filter @zcode/desktop run bundle -- --os ${{ matrix.target_os }} --arch ${{ matrix.target_arch }}
        env:
          CI: 'true'
          ZCODE_SKIP_REMOTE_ASSETS: '1'
          ZCODE_ENABLE_MAC_SIGN: '0'
          ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: 'true'

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ycode-${{ matrix.os_name }}-${{ matrix.target_arch }}
          path: |
            packages/desktop/dist/*.exe
            packages/desktop/dist/*.dmg
            packages/desktop/dist/*.zip
            packages/desktop/dist/*.AppImage
            packages/desktop/dist/*.deb
            packages/desktop/dist/*.rpm
          if-no-files-found: warn
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Flatten and organize release assets
        run: |
          mkdir -p dist-release
          find release-artifacts -type f \( -name "*.exe" -o -name "*.dmg" -o -name "*.zip" -o -name "*.AppImage" -o -name "*.deb" -o -name "*.rpm" \) -exec cp -v {} dist-release/ \;
          echo "Release files ready:"
          ls -la dist-release/

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-release/*
          prerelease: ${{ github.event.inputs.prerelease || false }}
          generate_release_notes: true
          draft: false
