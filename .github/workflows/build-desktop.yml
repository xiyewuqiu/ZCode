name: Build & Release Desktop App (Windows)

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish to GitHub Releases'
        required: false
        type: boolean
        default: false
      prerelease:
        description: 'Mark as Pre-release'
        required: false
        type: boolean
        default: false
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'packages/desktop/**'
      - 'packages/services/**'
      - 'packages/shared/**'
      - 'packages/ui/**'
      - 'pnpm-lock.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

permissions:
  contents: write

jobs:
  build:
    name: Build Windows (x64)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Cache Electron binaries (Windows)
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\electron\Cache
          key: electron-cache-windows-x64-${{ hashFiles('packages/desktop/package.json') }}
          restore-keys: |
            electron-cache-windows-x64-
            electron-cache-windows-

      - name: Cache electron-builder tools (Windows)
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\electron-builder\Cache
          key: electron-builder-tools-windows-${{ hashFiles('packages/desktop/package.json') }}
          restore-keys: |
            electron-builder-tools-windows-

      - name: Install project dependencies
        # --prefer-offline：pnpm store 缓存命中时跳过 registry 一致性检查，缩短安装关键路径。
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build shared packages
        run: pnpm build:bootstrap
        env:
          ZCODE_SKIP_REMOTE_ASSETS: '1'

      - name: Bundle Desktop App (Windows x64)
        run: pnpm --filter @zcode/desktop run bundle -- --os win --arch x64
        env:
          CI: 'true'
          ZCODE_SKIP_REMOTE_ASSETS: '1'
          ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: 'true'

      - name: Upload Windows Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ycode-windows-x64
          path: packages/desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 30
          # NSIS 安装包本身已不可再压（store 直写），再走 artifact 的 deflate
          # 只会空耗几分钟 CPU，直接以 level 0 原样上传。
          compression-level: 0

      - name: Create or Update GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: packages/desktop/dist/*.exe
          prerelease: ${{ github.event.inputs.prerelease || false }}
          generate_release_notes: true
          draft: false
