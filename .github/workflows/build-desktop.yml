name: Build & Release Desktop App (Windows)

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish to GitHub Releases'
        required: false
        type: boolean
        default: false
      prerelease:
        description: 'Mark as Pre-release'
        required: false
        type: boolean
        default: false
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'packages/desktop/**'
      - 'packages/services/**'
      - 'packages/shared/**'
      - 'packages/ui/**'
      - 'pnpm-lock.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

permissions:
  contents: write

jobs:
  build:
    name: Build Windows (x64)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Cache Electron binaries (Windows)
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\electron\Cache
          key: electron-cache-windows-x64-${{ hashFiles('packages/desktop/package.json') }}
          restore-keys: |
            electron-cache-windows-x64-
            electron-cache-windows-

      - name: Cache electron-builder tools (Windows)
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\electron-builder\Cache
          key: electron-builder-tools-windows-${{ hashFiles('packages/desktop/package.json') }}
          restore-keys: |
            electron-builder-tools-windows-

      - name: Install project dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm build:bootstrap
        env:
          ZCODE_SKIP_REMOTE_ASSETS: '1'

      - name: Install Rust toolchain (cua-driver)
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          # vendor 的 platform-windows 存在 cfg 门控的 dead_code 函数（上游既有），
          # 默认的 -D warnings 会把它们升级为 error 导致编译失败；驱动构建不需要
          # warnings-as-errors 严格模式。
          warnings: false

      - name: Cache cargo registry and cua-driver target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            third-party/cua-driver/target
          key: cargo-cua-driver-${{ hashFiles('third-party/cua-driver/Cargo.lock') }}
          restore-keys: |
            cargo-cua-driver-

      - name: Build cua-driver native tool
        # vendored Rust 驱动必须在此编译并落到 bundled-tools，否则安装包缺少
        # resources/tools/cua-driver（electron-builder 对缺失源目录只告警不报错）。
        # RUSTFLAGS 显式清空：第三方组件（vendor）的 lint 策略属于组件自身，
        # 主仓的 warnings-as-errors 严格模式不侵入其编译（上游代码存在大量
        # cfg 门控/FFI 面的 dead_code，默认 warning 即可，不应升级为 error）。
        run: pnpm build:cua-driver
        env:
          RUSTFLAGS: ''

      - name: Bundle Desktop App (Windows x64)
        run: pnpm --filter @zcode/desktop run bundle -- --os win --arch x64
        env:
          CI: 'true'
          ZCODE_SKIP_REMOTE_ASSETS: '1'
          ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: 'true'

      - name: Upload Windows Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ycode-windows-x64
          path: packages/desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Create or Update GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: packages/desktop/dist/*.exe
          prerelease: ${{ github.event.inputs.prerelease || false }}
          generate_release_notes: true
          draft: false
